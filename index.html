<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trang kỷ niệm ngày yêu nhau — đếm ngày, đồng hồ thời gian và hiệu ứng trái tim." />
    <title>Anh Và Em</title>
    <link rel="icon" href="./assets/images/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <div class="full-screen d-flex justify-content-center align-items-center">
        <div class="content card card-parent border-0">
          <h1 class="text-center">Anh Và Em</h1>
          
          <div class="card text-center border-0 rounded-0">
            <div class="card-body">
              <h3 id="date">0 NGÀY</h3>
              <time>00:00:00</time>
            </div>
          </div>

          <div class="row mt-5">
            <div class="col-sm-12 col-md-4 d-flex justify-content-center">
              <div class="one text-center">
                <img
                  src="./assets/images/anh-1.jpeg"
                  class="avt shadow vanilla-tilt"
                  alt="Ảnh của anh"
                  width="230"
                  height="230"
                />
                <h3 class="mt-3">Anh nè</h3>
              </div>
            </div>
            <div class="col-sm-12 col-md-4 d-flex justify-content-center">
              <div id="heart" class="text-center">
                <img src="./assets/images/heart.svg" class="heart" alt="" />
                <div id="anni">...</div>
              </div>
            </div>
            <div class="col-sm-12 col-md-4 d-flex justify-content-center">
              <div class="two text-center">
                <img
                  src="./assets/images/em-1.jpeg"
                  class="avt shadow vanilla-tilt"
                  alt="Ảnh của em"
                  width="230"
                  height="230"
                />
                <h3 class="mt-3">Em nè</h3>
              </div>
            </div>
          </div>

          <div class="milestones text-center">
            <p id="together-breakdown" class="milestone-line">❤️</p>
            <p id="next-anniversary" class="milestone-line muted"></p>
          </div>

          <h4 class="text-center">
            Mãi yêu em.. <img src="./assets/images/heart.svg" width="18" alt="" />
          </h4>
        </div>
      </div>

      <div class="banner">
        <div class="clouds">
          <img src="./assets/images/cloud1.png" style="--i: 1" alt="" aria-hidden="true" />
          <img src="./assets/images/cloud2.png" style="--i: 2" alt="" aria-hidden="true" />
          <img src="./assets/images/cloud3.png" style="--i: 3" alt="" aria-hidden="true" />
          <img src="./assets/images/cloud4.png" style="--i: 4" alt="" aria-hidden="true" />
          <img src="./assets/images/cloud5.png" style="--i: 5" alt="" aria-hidden="true" />
          <div class="cloud-fade" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="music-bar" role="region" aria-label="Trình phát nhạc">
      <button type="button" class="icon-btn" id="music-prev" aria-label="Bài trước" title="Bài trước">⏮</button>
      <audio id="myAudio" controls loop preload="auto" muted></audio>
      <button type="button" class="icon-btn" id="music-next" aria-label="Bài sau" title="Đổi bài">⏭</button>
      <span id="music-track" class="music-track">Love Story</span>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
